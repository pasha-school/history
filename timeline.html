}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }

  const openExternal = ({ href }) =&gt; {

    }

  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,
      ...parsedState,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

    globalThis.openai.widgetState = state;

      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    { year: 330, short: &#x27;Новый Рим&#x27;, title: &#x27;основание Нового Рима&#x27;, detail: &#x27;Император Константин сделал город новой столицей. Вскоре его стали называть Константинополем.&#x27;, cat: &#x27;rome&#x27;, topic: &#x27;byzantium&#x27; },

    { year: 476, short: &#x27;падение Запада&#x27;, title: &#x27;падение Западной Римской империи&#x27;, detail: &#x27;Запад ослабили борьба за власть, хозяйственные трудности, нехватка надёжных войск и нападения германских племён.&#x27;, cat: &#x27;rome&#x27;, topic: &#x27;byzantium&#x27; },

    { year: 527, short: &#x27;Юстиниан&#x27;, title: &#x27;начало правления Юстиниана I&#x27;, detail: &#x27;При Юстиниане Византия достигла вершины своего могущества.&#x27;, cat: &#x27;justinian&#x27;, topic: &#x27;byzantium&#x27; },

    { year: 610, short: &#x27;начало проповеди&#x27;, title: &#x27;начало проповеди Мухаммеда&#x27;, detail: &#x27;Согласно мусульманской традиции, Мухаммед начал получать откровения и проповедовать веру в единого Бога — Аллаха.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },

    { year: 643, short: &#x27;взятие Дербента&#x27;, title: &#x27;взятие Дербента арабами&#x27;, detail: &#x27;Арабские войска дошли до Кавказа и захватили Дербент.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },
    { year: 648, label: &#x27;середина VII века&#x27;, short: &#x27;покорение Персии&#x27;, title: &#x27;покорение Персии арабами&#x27;, detail: &#x27;К середине VII века арабы разгромили Персидскую державу и включили её земли в своё государство.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },
    { year: 650, short: &#x27;Хазарский каганат&#x27;, title: &#x27;образование Хазарского каганата&#x27;, detail: &#x27;На Северном Кавказе и в Прикаспии возникло государство хазар.&#x27;, cat: &#x27;neighbors&#x27;, topic: &#x27;rus&#x27; },
    { year: 661, short: &#x27;Омейяды&#x27;, title: &#x27;начало правления Омейядов&#x27;, detail: &#x27;В Арабском халифате к власти пришла династия Омейядов. Она правила до 750 года.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },

    { year: 732, short: &#x27;битва при Пуатье&#x27;, title: &#x27;победа франков при Пуатье&#x27;, detail: &#x27;Карл Мартелл разбил арабское войско. Прозвище Мартелл означает «Молот».&#x27;, cat: &#x27;franks&#x27;, topic: &#x27;franks&#x27; },
    { year: 750, short: &#x27;Аббасиды&#x27;, title: &#x27;начало правления Аббасидов&#x27;, detail: &#x27;К власти в Арабском халифате пришла династия Аббасидов. Она правила до 1258 года.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },
    { year: 800, short: &#x27;Карл — император&#x27;, title: &#x27;провозглашение Карла Великого императором&#x27;, detail: &#x27;Папа римский короновал Карла. На Западе появилась империя, считавшая себя наследницей Рима.&#x27;, cat: &#x27;franks&#x27;, topic: &#x27;franks&#x27; },
    { year: 786, label: &#x27;786–809&#x27;, short: &#x27;Харун ар-Рашид&#x27;, title: &#x27;правление Харуна ар-Рашида&#x27;, detail: &#x27;При этом аббасидском халифе Багдад переживал экономический подъём и расцвет культуры.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },
    { year: 805, label: &#x27;начало IX века&#x27;, short: &#x27;распад халифата&#x27;, title: &#x27;начало распада Арабского халифата&#x27;, detail: &#x27;Эмиры всё чаще правили своими областями самостоятельно и оставляли налоги себе. Халифат начал распадаться на части.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },
    { year: 843, short: &#x27;Верденский раздел&#x27;, title: &#x27;раздел империи Карла Великого&#x27;, detail: &#x27;Три внука Карла разделили империю. Из западной и восточной частей позднее выросли Франция и Германия.&#x27;, cat: &#x27;franks&#x27;, topic: &#x27;franks&#x27; },
    { year: 862, short: &#x27;призвание Рюрика&#x27;, title: &#x27;летописная дата образования государства Русь&#x27;, detail: &#x27;Согласно летописи, в 862 году на княжение был призван Рюрик.&#x27;, cat: &#x27;neighbors&#x27;, topic: &#x27;rus&#x27; },
    { year: 863, short: &#x27;Кирилл и Мефодий&#x27;, title: &#x27;начало деятельности Кирилла и Мефодия&#x27;, detail: &#x27;Братья прибыли в Великую Моравию, создали славянскую азбуку и начали переводить христианские книги.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 865, short: &#x27;крещение Болгарии&#x27;, title: &#x27;принятие христианства Болгарией&#x27;, detail: &#x27;Болгария приняла христианство из Византии при князе Борисе.&#x27;, cat: &#x27;neighbors&#x27;, topic: &#x27;byzantium&#x27; },
    { year: 871, label: &#x27;871–899&#x27;, short: &#x27;Альфред Великий&#x27;, title: &#x27;правление Альфреда Великого&#x27;, detail: &#x27;Альфред создал флот, укрепил крепости, перестроил войско и возглавил борьбу Англии с датчанами.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 882, label: &#x27;882–912&#x27;, short: &#x27;княжение Олега&#x27;, title: &#x27;княжение Олега на Руси&#x27;, detail: &#x27;Олег объединил Новгород и Киев и правил Русью до 912 года.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 962, short: &#x27;империя Оттона&#x27;, title: &#x27;образование Священной Римской империи&#x27;, detail: &#x27;Папа римский провозгласил германского короля Оттона I императором.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 966, short: &#x27;крещение Польши&#x27;, title: &#x27;принятие христианства Польшей&#x27;, detail: &#x27;Польша приняла христианство по римскому образцу и вошла в мир латинской культуры.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 987, label: &#x27;987–996&#x27;, short: &#x27;Гуго Капет&#x27;, title: &#x27;правление Гуго Капета&#x27;, detail: &#x27;Гуго Капет стал королём Франции и основал новую королевскую династию — Капетингов.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 988, short: &#x27;Крещение Руси&#x27;, title: &#x27;Крещение Руси&#x27;, detail: &#x27;Единая вера помогала объединить Русь, а союз с богатой христианской Византией укреплял положение князя Владимира.&#x27;, cat: &#x27;neighbors&#x27;, topic: &#x27;rus&#x27; },
    { year: 992, short: &#x27;победа над печенегами&#x27;, title: &#x27;победа Владимира на реке Трубеже&#x27;, detail: &#x27;Князь Владимир Святославич победил печенегов на реке Трубеже.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 1000, label: &#x27;около 1000&#x27;, short: &#x27;викинги в Америке&#x27;, title: &#x27;достижение Винланда&#x27;, detail: &#x27;Викинги достигли побережья Северной Америки примерно за 500 лет до Колумба.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 1018, short: &#x27;падение Болгарского царства&#x27;, title: &#x27;падение Первого Болгарского царства&#x27;, detail: &#x27;Византия завоевала Болгарию и вновь подчинила большую часть Балкан.&#x27;, cat: &#x27;neighbors&#x27;, topic: &#x27;byzantium&#x27; },
    { year: 1054, short: &#x27;раскол Церкви&#x27;, title: &#x27;раскол христианской Церкви&#x27;, detail: &#x27;Папа римский и патриарх Константинопольский предали друг друга анафеме. Восточных христиан стали называть православными, а западных — католиками.&#x27;, cat: &#x27;society&#x27;, topic: &#x27;society&#x27; },
    { year: 1066, short: &#x27;завоевание Англии&#x27;, title: &#x27;нормандское завоевание Англии&#x27;, detail: &#x27;Герцог Вильгельм Нормандский победил англосаксов и стал королём Англии — Вильгельмом Завоевателем.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 1072, short: &#x27;Правда Ярославичей&#x27;, title: &#x27;создание Правды Ярославичей&#x27;, detail: &#x27;Сыновья Ярослава Мудрого дополнили древнерусский сборник законов.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 1074, short: &#x27;Мономах и Гита&#x27;, title: &#x27;свадьба Владимира Мономаха и Гиты&#x27;, detail: &#x27;Русский князь Владимир Мономах женился на Гите, дочери последнего англосаксонского короля Гарольда.&#x27;, cat: &#x27;europe&#x27;, topic: &#x27;europe&#x27; },
    { year: 1209, label: &#x27;1209–1229&#x27;, short: &#x27;Альбигойские войны&#x27;, title: &#x27;Альбигойские войны&#x27;, detail: &#x27;Папа римский призвал рыцарей в поход против альбигойцев — еретиков на юге Франции. Война закончилась в 1229 году.&#x27;, cat: &#x27;society&#x27;, topic: &#x27;society&#x27; },
    { year: 1215, short: &#x27;святая инквизиция&#x27;, title: &#x27;учреждение святой инквизиции&#x27;, detail: &#x27;Церковь создала особое следствие и суд для поиска и наказания еретиков.&#x27;, cat: &#x27;society&#x27;, topic: &#x27;society&#x27; },
    { year: 1258, short: &#x27;падение Багдада&#x27;, title: &#x27;конец правления Аббасидов&#x27;, detail: &#x27;Монголы захватили Багдад. Правление династии Аббасидов в Арабском халифате закончилось.&#x27;, cat: &#x27;islam&#x27;, topic: &#x27;islam&#x27; },
    { year: 1453, short: &#x27;падение Византии&#x27;, title: &#x27;падение Константинополя&#x27;, detail: &#x27;Османы взяли Константинополь. Византийская империя прекратила существование.&#x27;, cat: &#x27;rome&#x27;, topic: &#x27;byzantium&#x27; }
  ];
  const lanes = [&#x27;up&#x27;, &#x27;mid-down&#x27;, &#x27;mid-up&#x27;, &#x27;down&#x27;];
  const container = root.querySelector(&#x27;.events&#x27;);
  const mobile = root.querySelector(&#x27;.mobile-events&#x27;);
  const timeline = root.querySelector(&#x27;.timeline&#x27;);
  const filter = root.querySelector(&#x27;select&#x27;);
  const title = root.querySelector(&#x27;.detail-title&#x27;);
  const text = root.querySelector(&#x27;.detail-text&#x27;);

  function selectEvent(event, button) {
    root.querySelectorAll(&#x27;button[aria-pressed]&#x27;).forEach(item =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
    button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
    title.textContent = `${event.label || event.year} — ${event.title}`;
    text.textContent = event.detail;
  }

  function render(topic) {
    container.replaceChildren();
    mobile.replaceChildren();
    const shown = topic === &#x27;all&#x27; ? events : events.filter(event =&gt; event.topic === topic);
    timeline.style.width = `${Math.max(820, shown.length * 112)}px`;

    shown.forEach((event, index) =&gt; {
      const position = shown.length === 1 ? 50 : 7 + (index / (shown.length - 1)) * 86;
      const lane = lanes[index % lanes.length];
      const wrap = document.createElement(&#x27;div&#x27;);
      wrap.className = &#x27;event-wrap&#x27;;
      wrap.style.left = `${position}%`;

      const stem = document.createElement(&#x27;span&#x27;);
      stem.className = `stem ${lane.includes(&#x27;up&#x27;) ? &#x27;up&#x27; : &#x27;down&#x27;}`;
      stem.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);

      const dot = document.createElement(&#x27;span&#x27;);
      dot.className = `dot ${event.cat}`;
      dot.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);

      const button = document.createElement(&#x27;button&#x27;);
      button.type = &#x27;button&#x27;;
